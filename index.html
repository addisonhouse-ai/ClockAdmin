<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Addison House ClockAdmin — App descontinuada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="https://cdn.shopify.com/s/files/1/0359/7375/9108/files/FAV_INV_bfaf09fd-836d-4fb0-ac96-992aeda01c00.jpg?v=1782218353">
  <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
  <noscript><meta http-equiv="refresh" content="8;url=https://addisonhouse-ai.github.io/apps/"></noscript>
  <style>
    :root {
      --black: #000000;
      --white: #FFFFFF;
      --line: rgba(255, 255, 255, 0.22);
      --dim: rgba(255, 255, 255, 0.55);
      --duration: 8s;
      --din: "D-DIN", "DIN Next LT Pro", "DIN Alternate", "DIN", sans-serif;
      --din-cond: "D-DIN Condensed", "DIN Condensed", "D-DIN", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100%; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--din);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      margin: 0 0 34px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    /* Reloj: la manecilla barre el tiempo que falta para redirigir */
    .dial {
      width: 132px;
      height: 132px;
      margin: 0 auto 34px;
      display: block;
    }

    .dial-face { fill: none; stroke: var(--line); stroke-width: 1; }
    .dial-tick { stroke: var(--line); stroke-width: 2; stroke-linecap: butt; }
    .dial-track { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; }
    .dial-progress {
      fill: none;
      stroke: var(--white);
      stroke-width: 2;
      stroke-linecap: butt;
      stroke-dasharray: 396;
      stroke-dashoffset: 0;
      animation: sweep var(--duration) linear forwards;
    }
    .dial-hand {
      stroke: var(--white);
      stroke-width: 2;
      stroke-linecap: butt;
      transform-origin: 80px 80px;
      animation: rotate var(--duration) linear forwards;
    }
    .dial-pin { fill: var(--white); }
    .dial-count {
      font-family: var(--din-cond);
      font-size: 40px;
      font-weight: 700;
      fill: var(--white);
      text-anchor: middle;
      dominant-baseline: central;
    }

    @keyframes sweep { to { stroke-dashoffset: 396; } }
    @keyframes rotate { to { transform: rotate(360deg); } }

    h1 {
      font-family: var(--din-cond);
      font-weight: 700;
      text-transform: uppercase;
      font-size: clamp(38px, 11vw, 62px);
      line-height: 0.94;
      letter-spacing: 0.01em;
      margin: 0 0 20px;
    }

    h1 span {
      display: block;
      font-weight: 400;
    }

    p.lede {
      font-size: 16px;
      line-height: 1.55;
      color: var(--dim);
      margin: 0 auto 34px;
      max-width: 38ch;
    }

    .cta {
      display: inline-block;
      background: var(--white);
      color: var(--black);
      font-family: var(--din);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 34px;
      border: 2px solid var(--white);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .cta:hover { background: var(--black); color: var(--white); }
    .cta:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }

    .status {
      margin: 26px 0 0;
      font-size: 13px;
      color: var(--dim);
    }

    .status button {
      background: none;
      border: none;
      color: var(--dim);
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 4px;
    }

    .status button:hover { color: var(--white); }
    .status button:focus-visible { outline: 1px solid var(--white); outline-offset: 2px; }

    .url {
      display: block;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.35);
      word-break: break-all;
    }

    @media (prefers-reduced-motion: reduce) {
      .dial-progress, .dial-hand { animation: none; }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Addison House · Clocktrack</p>

    <svg class="dial" viewBox="0 0 160 160" role="img" aria-hidden="true">
      <circle class="dial-face" cx="80" cy="80" r="72"/>
      <circle class="dial-track" cx="80" cy="80" r="63"/>
      <circle class="dial-progress" cx="80" cy="80" r="63" transform="rotate(-90 80 80)"/>
      <g class="dial-tick">
        <line x1="80" y1="20" x2="80" y2="30"/>
        <line x1="140" y1="80" x2="130" y2="80"/>
        <line x1="80" y1="140" x2="80" y2="130"/>
        <line x1="20" y1="80" x2="30" y2="80"/>
      </g>
      <text class="dial-count" id="count" x="80" y="82">8</text>
      <line class="dial-hand" x1="80" y1="80" x2="80" y2="38"/>
      <circle class="dial-pin" cx="80" cy="80" r="3"/>
    </svg>

    <h1>Esta app<span>ya no está disponible</span></h1>
    <p class="lede">Clocktrack se movió junto con el resto de las herramientas de Addison House. Todo está en el nuevo directorio de apps.</p>

    <a class="cta" href="https://addisonhouse-ai.github.io/apps/">Ir al directorio</a>

    <p class="status" aria-live="polite">
      <span id="msg">Te llevamos allá en <span id="secs">8</span> segundos.</span>
      <button type="button" id="stop">Cancelar</button>
      <span class="url">https://addisonhouse-ai.github.io/apps/</span>
    </p>
  </main>

  <script>
    (function () {
      var destino = "https://addisonhouse-ai.github.io/apps/";
      var restante = 8;
      var count = document.getElementById("count");
      var secs = document.getElementById("secs");
      var msg = document.getElementById("msg");
      var stop = document.getElementById("stop");

      var reloj = setInterval(function () {
        restante--;
        count.textContent = restante > 0 ? restante : 0;
        secs.textContent = restante > 0 ? restante : 0;
        if (restante <= 0) {
          clearInterval(reloj);
          window.location.replace(destino);
        }
      }, 1000);

      stop.addEventListener("click", function () {
        clearInterval(reloj);
        document.querySelector(".dial-progress").style.animation = "none";
        document.querySelector(".dial-hand").style.animation = "none";
        msg.textContent = "Redirección cancelada. Usa el botón cuando quieras.";
        stop.remove();
      });
    })();
  </script>
</body>
</html>
